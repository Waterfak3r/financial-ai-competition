modelRoleStorage: project
modelRoles:
  implement: "@default"
  draft: "@default"
  polish: "@default"
  review: "@default"
  scout: "@default"
  default: openai-codex/gpt-6.1-sol:xhigh
retry:
  modelFallback: false
  waitForUsageReset: true
  usageAwareFallback: false
  fallbackChains: {}
async:
  enabled: true
task:
  batch: true
  eager: preferred
  maxConcurrency: 3
  maxRecursionDepth: 1
  disabledAgents:
    - security-reviewer
  isolation:
    enabled: true
    apply: false
    merge: patch
  prewalk: false
  agentPrewalk:
    implementer: "off"
    writer: "off"
    editor: "off"
    reviewer: "off"
    scout: "off"
  showResolvedModelBadge: true
prewalk:
  enabled: false
worktree:
  cleanSource: false
  onStart: "off"
  onExit: keep