[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent"
version = "0.1.0"
description = "文本型 PDF 解析、确定性年度分析和本地预检 API；LangGraph 年报调查通过可选依赖启用。"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]
agents = [
    "langgraph>=1.2,<1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]
testpaths = ["../tests/unit", "../tests/integration"]
